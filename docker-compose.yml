name: network-picasso

services:
  db:
    container_name: network-picasso-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NETWORK_PICASSO_POSTGRES_DB:-network_picasso}
      POSTGRES_USER: ${NETWORK_PICASSO_POSTGRES_USER:-network_picasso}
      POSTGRES_PASSWORD: ${NETWORK_PICASSO_POSTGRES_PASSWORD:-network_picasso_dev}
    volumes:
      - network_picasso_postgres:/var/lib/postgresql/data
    ports:
      - "${NETWORK_PICASSO_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    container_name: network-picasso-api
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NETWORK_PICASSO_HOST: 0.0.0.0
      NETWORK_PICASSO_PORT: 8787
      NETWORK_PICASSO_MCP_BASE_URL: http://host.docker.internal:4000
      NETWORK_PICASSO_OLLAMA_BASE_URL: ${NETWORK_PICASSO_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      NETWORK_PICASSO_DATABASE_URL: postgresql://${NETWORK_PICASSO_POSTGRES_USER:-network_picasso}:${NETWORK_PICASSO_POSTGRES_PASSWORD:-network_picasso_dev}@db:5432/${NETWORK_PICASSO_POSTGRES_DB:-network_picasso}
    ports:
      - "${NETWORK_PICASSO_API_PORT:-8788}:8787"
    volumes:
      - ./inputs:/app/inputs
      - ./outputs:/app/outputs
      - ./examples:/app/examples:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; json.load(urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  ui:
    container_name: network-picasso-ui
    build:
      context: ./ui
      dockerfile: Dockerfile
    environment:
      NETWORK_PICASSO_UI_PORT: 5173
      NETWORK_PICASSO_API_TARGET: http://network-picasso-api:8787
    ports:
      - "${NETWORK_PICASSO_UI_PORT:-5174}:5173"
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: network-picasso-net

volumes:
  network_picasso_postgres:
