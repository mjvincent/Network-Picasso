[project]
name = "network-picasso"
version = "0.1.0"
description = "Local-first agentic IBM Cloud network diagram generator."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
network-picasso = "network_picasso.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
