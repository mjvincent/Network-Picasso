[project]
name = "network-picasso"
version = "0.5.1"
description = "Local-first IBM Cloud architecture advisor and Draw.io diagram workbench."
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
network-picasso = "network_picasso.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
